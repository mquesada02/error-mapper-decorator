name: Docs

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "README.md"
      - "typedoc.json"
      - "package.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "src/**"
      - "README.md"
      - "typedoc.json"
      - "package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm run docs` (not `pnpm docs`, which is a built-in that opens the
      # package homepage in a browser and shadows the same-named script).
      - run: pnpm run docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site

  # Publish only from main; pull requests stop after the build above, which still
  # validates that the docs compile (typedoc runs with treatWarningsAsErrors).
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
